<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A horizontal brutalist concrete span above a low band of warm light.">
  <defs>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100f11"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="s-concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a251e"/>
      <stop offset="1" stop-color="#100e0c"/>
    </linearGradient>
    <linearGradient id="s-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb673" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd3a3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffb673" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#s-sky)"/>
  <!-- piers -->
  <rect x="120" y="230" width="90" height="270" fill="url(#s-concrete)"/>
  <rect x="590" y="230" width="90" height="270" fill="url(#s-concrete)"/>
  <!-- the span -->
  <rect x="60" y="150" width="680" height="90" fill="url(#s-concrete)"/>
  <rect x="60" y="150" width="680" height="6" fill="#ffb673" opacity="0.14"/>
  <!-- warm light band beneath the span -->
  <rect x="0" y="360" width="800" height="70" fill="url(#s-light)"/>
  <rect x="0" y="430" width="800" height="70" fill="#ffb673" opacity="0.05"/>
</svg>
