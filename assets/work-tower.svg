<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A monolithic concrete tower split by a single vertical shaft of warm light.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111013"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="slit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3a3"/>
      <stop offset="1" stop-color="#d98a45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#ffb673" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffb673" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffb673" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect x="250" y="80" width="140" height="420" fill="url(#concrete)"/>
  <rect x="410" y="120" width="170" height="380" fill="url(#concrete)"/>
  <rect x="395" y="60" width="14" height="440" fill="url(#slit)"/>
  <rect x="0" y="0" width="800" height="500" fill="url(#glow)"/>
  <rect x="250" y="80" width="140" height="420" fill="#000" opacity="0.28"/>
  <rect x="0" y="470" width="800" height="30" fill="#ffb673" opacity="0.05"/>
</svg>
