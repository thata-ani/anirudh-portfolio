<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A massive brutalist concrete portal with warm light pouring through the opening.">
  <defs>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0e10"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="a-concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26221c"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <radialGradient id="a-light" cx="50%" cy="70%" r="55%">
      <stop offset="0" stop-color="#ffd3a3" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffb673" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb673" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#a-sky)"/>
  <!-- light behind the portal -->
  <ellipse cx="400" cy="360" rx="230" ry="200" fill="url(#a-light)"/>
  <!-- the wall with a portal cut out -->
  <path d="M60 60 H740 V500 H60 Z M300 500 V260 a100 100 0 0 1 200 0 V500 Z" fill="url(#a-concrete)" fill-rule="evenodd"/>
  <rect x="60" y="60" width="680" height="10" fill="#ffb673" opacity="0.06"/>
</svg>
